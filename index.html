<!<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Corrida 2D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            color: #ff4757;
            font-size: 26px;
            margin-bottom: 5px;
        }

        header p {
            color: #a4b0be;
            font-size: 14px;
        }

        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #2ed573;
        }

        canvas {
            display: block;
            background-color: #2f3542;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .controls-hint {
            margin-top: 15px;
            color: #ced6e0;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏎️ Simulador de Corrida 2D</h1>
        <p>Desvie dos outros carros e mantenha o veículo na pista!</p>
    </header>

    <div class="game-container">
        <div class="hud">
            <div>Distância: <span id="score">0</span>m</div>
            <div>Velocidade: <span id="speed">0</span> km/h</div>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <div class="controls-hint">
        Use as setas do teclado: <strong>↑</strong> Acelerar | <strong>↓</strong> Frear | <strong>← →</strong> Volante
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const speedEl = document.getElementById('speed');

        let score = 0;
        let gameOver = false;
        let roadOffset = 0;

        // Propriedades do Carro Principal
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 120,
            width: 40,
            height: 70,
            speed: 0,
            maxSpeed: 10,
            accel: 0.2,
            friction: 0.05,
            turnSpeed: 5,
            color: '#ff4757'
        };

        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
        const obstacles = [];
        const obstacleColors = ['#eccc68', '#70a1ff', '#7bed9f', '#ff6b81', '#a29bfe'];

        function createObstacle() {
            const width = 40;
            const height = 70;
            const x = Math.random() * (canvas.width - 120 - width) + 60;
            const speed = Math.random() * 2 + 3;
            const color = obstacleColors[Math.floor(Math.random() * obstacleColors.length)];
            obstacles.push({ x, y: -height, width, height, speed, color });
        }

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Desenho dos Veículos
        function drawCar(x, y, width, height, color) {
            // Corpo Principal
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);

            // Pneus
            ctx.fillStyle = '#000000';
            ctx.fillRect(x - 4, y + 10, 5, 15);
            ctx.fillRect(x + width - 1, y + 10, 5, 15);
            ctx.fillRect(x - 4, y + height - 25, 5, 15);
            ctx.fillRect(x + width - 1, y + height - 25, 5, 15);

            // Parabrisa e Vidros
            ctx.fillStyle = '#70a1ff';
            ctx.fillRect(x + 5, y + 15, width - 10, 15);
            ctx.fillRect(x + 7, y + height - 25, width - 14, 10);
        }

        // Desenho da Pista
        function drawRoad() {
            // Asfalto
            ctx.fillStyle = '#2f3542';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Faixas de Grama Lateral
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(0, 0, 50, canvas.height);
            ctx.fillRect(canvas.width - 50, 0, 50, canvas.height);

            // Linhas Pistas Animadas
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            ctx.setLineDash([]);
        }

        // Atualização dos Cálculos e Lógica
        function update() {
            if (gameOver) return;

            // Aceleração e Fricção
            if (keys.ArrowUp) player.speed = Math.min(player.speed + player.accel, player.maxSpeed);
            else if (keys.ArrowDown) player.speed = Math.max(player.speed - player.accel * 2, 0);
            else player.speed = Math.max(player.speed - player.friction, 0);

            // Movimento Lateral
            if (player.speed > 0) {
                if (keys.ArrowLeft && player.x > 55) player.x -= player.turnSpeed * (player.speed / player.maxSpeed);
                if (keys.ArrowRight && player.x < canvas.width - 55 - player.width) player.x += player.turnSpeed * (player.speed / player.maxSpeed);
            }

            roadOffset += player.speed * 2;
            score += Math.floor(player.speed);

            // Gerar Tráfego
            if (Math.random() < 0.02 && obstacles.length < 4) {
                createObstacle();
            }

            // Atualização de Obstáculos e Colisão
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += player.speed - obs.speed + 2;

                // Detecção de Colisão
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameOver = true;
                    alert('💥 Batida! Pontuação final: ' + score + 'm');
                    document.location.reload();
                }

                if (obs.y > canvas.height + 100) {
                    obstacles.splice(i, 1);
                }
            }

            scoreEl.textContent = score;
            speedEl.textContent = Math.floor(player.speed * 18);
        }

        // Renderização Contínua
        function loop() {
            update();
            drawRoad();
            obstacles.forEach(obs => drawCar(obs.x, obs.y, obs.width, obs.height, obs.color));
            drawCar(player.x, player.y, player.width, player.height, player.color);
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
