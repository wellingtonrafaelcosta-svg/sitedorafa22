<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simulador Urbano 3D - Cidade Viva</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{overflow:hidden;background:#050811;color:#fff;user-select:none}
#canvas-container{width:100vw;height:100vh}

.hud{
position:absolute;top:20px;left:20px;z-index:10;
background:rgba(10,15,29,.88);padding:16px 20px;border-radius:12px;
border:1px solid rgba(56,189,248,.25);
box-shadow:0 10px 30px #000c;min-width:270px;
pointer-events:none;backdrop-filter:blur(8px)
}
.hud h2{font-size:16px;color:#38bdf8;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.stat-row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;color:#cbd5e1}
.stat-bar{background:#1e293b;height:8px;border-radius:4px;overflow:hidden;margin:4px 0 10px}
.stat-fill{background:linear-gradient(90deg,#0284c7,#38bdf8);height:100%;width:0%;transition:.3s}

.garage-panel{
position:absolute;top:20px;right:20px;z-index:10;
background:rgba(10,15,29,.88);padding:14px;border-radius:12px;
border:1px solid rgba(234,179,8,.3);display:flex;
flex-direction:column;gap:6px;backdrop-filter:blur(8px)
}
.garage-btn{
background:#1e293b;color:#f8fafc;border:1px solid #334155;
padding:8px 12px;border-radius:6px;cursor:pointer;
font-weight:600;font-size:12px;transition:.2s
}
.garage-btn:hover{background:#0284c7;border-color:#38bdf8}

.crosshair{
position:absolute;top:50%;left:50%;width:12px;height:12px;
border:2px solid rgba(239,68,68,.8);border-radius:50%;
transform:translate(-50%,-50%);pointer-events:none;z-index:5
}

.quest-box{
position:absolute;bottom:20px;left:50%;z-index:10;
transform:translateX(-50%);background:rgba(10,15,29,.9);
padding:10px 24px;border-radius:20px;border:1px solid #eab308;
color:#fef08a;font-weight:600;font-size:13px;
pointer-events:none;box-shadow:0 4px 20px #0008;
text-align:center;white-space:nowrap
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div class="hud">
<h2>🏙️ Cidade Viva</h2>

<div class="stat-row">
<span>Nível:</span><strong id="level">1</strong>
</div>

<div class="stat-bar">
<div id="xp-bar" class="stat-fill"></div>
</div>

<div class="stat-row">
<span>Veículo:</span>
<strong id="car-name" style="color:#38bdf8">Supercarro V8</strong>
</div>

<div class="stat-row">
<span>Velocidade:</span>
<span id="stat-speed">0 km/h</span>
</div>

<div class="stat-row">
<span>Créditos:</span>
<span style="color:#facc15">🪙 <span id="gold">0</span></span>
</div>

<div class="stat-row">
<span>População:</span>
<span style="color:#4ade80"><span id="pop-count">0</span></span>
</div>

<div class="stat-row">
<span>Trânsito:</span>
<span style="color:#fb923c"><span id="traffic-count">0</span> carros</span>
</div>
</div>

<div class="garage-panel">
<div style="font-size:11px;color:#94a3b8;font-weight:bold">
SELEÇÃO DE VEÍCULO
</div>

<button class="garage-btn" onclick="switchCar(0)">
🏎️ Supercarro V8
</button>

<button class="garage-btn" onclick="switchCar(1)">
🛻 SUV Tático
</button>

<button class="garage-btn" onclick="switchCar(2)">
⚡ Hypercar Neon
</button>
</div>

<div class="crosshair"></div>

<div class="quest-box" id="quest-text">
🎮 [W,A,S,D] Dirigir | [ESPAÇO] Canhão | Explore a cidade!
</div>

<div id="canvas-container"></div>

<script>

/* =========================================================
   CIDADE
========================================================= */

const container=document.getElementById("canvas-container");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x101827);
scene.fog=new THREE.FogExp2(0x101827,0.0045);

const camera=new THREE.PerspectiveCamera(
55,
innerWidth/innerHeight,
.1,
800
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;

renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

container.appendChild(renderer.domElement);

const clock=new THREE.Clock();

/* objetos reutilizados */

const dummy=new THREE.Object3D();
const v1=new THREE.Vector3();
const v2=new THREE.Vector3();
const up=new THREE.Vector3(0,1,0);
const camOffset=new THREE.Vector3();


/* =========================================================
   ILUMINAÇÃO
========================================================= */

scene.add(
new THREE.HemisphereLight(
0xdbeafe,
0x172033,
0.7
));

const sun=new THREE.DirectionalLight(
0xffedd5,
1.6
);

sun.position.set(120,150,80);
sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

sun.shadow.camera.near=10;
sun.shadow.camera.far=350;

sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;

scene.add(sun);


/* =========================================================
   CHÃO / RUAS
========================================================= */

const CITY=600;
const ROAD=20;
const BLOCK=50;

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(CITY,CITY),
new THREE.MeshLambertMaterial({color:0x151b25})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   RUAS
========================================================= */

const roadMat=new THREE.MeshLambertMaterial({
color:0x20252d
});

for(let x=-300;x<=300;x+=70){

const road=new THREE.Mesh(
new THREE.PlaneGeometry(20,CITY),
roadMat
);

road.rotation.x=-Math.PI/2;
road.position.set(x,.015,0);

scene.add(road);

const road2=new THREE.Mesh(
new THREE.PlaneGeometry(CITY,20),
roadMat
);

road2.rotation.x=-Math.PI/2;
road2.position.set(0,.016,x);

scene.add(road2);
}


/* =========================================================
   FAIXAS DE TRÂNSITO
========================================================= */

const lineMat=new THREE.MeshBasicMaterial({
color:0xf8fafc
});

for(let x=-280;x<=280;x+=70){

for(let z=-285;z<285;z+=12){

const line=new THREE.Mesh(
new THREE.PlaneGeometry(.35,6),
lineMat
);

line.rotation.x=-Math.PI/2;
line.position.set(x,.03,z);

scene.add(line);
}

for(let z=-280;z<=280;z+=70){

for(let x=-285;x<285;x+=12){

const line=new THREE.Mesh(
new THREE.PlaneGeometry(6,.35),
lineMat
);

line.rotation.x=-Math.PI/2;
line.position.set(x,.031,z);

scene.add(line);
}
}
}


/* =========================================================
   PRÉDIOS
========================================================= */

const buildings=[];

const buildingColors=[
0x263241,
0x334155,
0x374151,
0x1e293b,
0x3f3f46,
0x475569
];

for(let x=-265;x<=265;x+=70){

for(let z=-265;z<=265;z+=70){

/* centro da cidade mais aberto */

if(Math.abs(x)<45 && Math.abs(z)<45) continue;

const h=15+Math.random()*65;

const geo=new THREE.BoxGeometry(
BLOCK,
h,
BLOCK
);

const mat=new THREE.MeshStandardMaterial({
color:buildingColors[
Math.floor(Math.random()*buildingColors.length)
],
roughness:.8
});

const building=new THREE.Mesh(geo,mat);

building.position.set(
x,
h/2,
z
);

building.castShadow=true;
building.receiveShadow=true;

scene.add(building);

buildings.push(building);


/* =====================================================
   JANELAS
===================================================== */

const windowMat=new THREE.MeshBasicMaterial({
color:Math.random()>.45?0xfef3c7:0x93c5fd
});

for(let wx=-20;wx<=20;wx+=8){

for(let wy=7;wy<h-5;wy+=8){

if(Math.random()<.35) continue;

const win=new THREE.Mesh(
new THREE.PlaneGeometry(3,3),
windowMat
);

win.position.set(
x+wx,
wy,
z-BLOCK/2-.02
);

scene.add(win);
}
}
}
}


/* =========================================================
   ÁRVORES
========================================================= */

const trunkGeo=new THREE.CylinderGeometry(.35,.45,4,7);
const trunkMat=new THREE.MeshLambertMaterial({color:0x5b3a29});

const leafGeo=new THREE.SphereGeometry(2.8,8,8);
const leafMat=new THREE.MeshLambertMaterial({color:0x166534});

for(let i=0;i<110;i++){

const tree=new THREE.Group();

const trunk=new THREE.Mesh(trunkGeo,trunkMat);
trunk.position.y=2;

const leaves=new THREE.Mesh(leafGeo,leafMat);
leaves.position.y=5;

tree.add(trunk,leaves);

let x=(Math.random()-.5)*540;
let z=(Math.random()-.5)*540;

tree.position.set(x,0,z);

scene.add(tree);
}


/* =========================================================
   POSTES + LUZES
========================================================= */

const poleGeo=new THREE.CylinderGeometry(.12,.16,7,8);
const poleMat=new THREE.MeshLambertMaterial({
color:0x111827
});

const lampGeo=new THREE.SphereGeometry(.35,8,8);
const lampMat=new THREE.MeshBasicMaterial({
color:0xfff3a3
});

for(let x=-300;x<=300;x+=35){

for(let z=-300;z<=300;z+=35){

if(Math.random()<.45) continue;

const pole=new THREE.Mesh(poleGeo,poleMat);
pole.position.set(x,3.5,z);

scene.add(pole);

const lamp=new THREE.Mesh(lampGeo,lampMat);
lamp.position.set(x,7,z);

scene.add(lamp);
}
}


/* =========================================================
   NPCs
========================================================= */

const npcs=[];

const pedGeo=new THREE.CylinderGeometry(
.32,.26,1.5,8
);

const pedColors=[
0x38bdf8,
0xf97316,
0xf43f5e,
0xa78bfa,
0x4ade80,
0xfacc15,
0xe2e8f0
];

for(let i=0;i<80;i++){

const mesh=new THREE.Mesh(
pedGeo,
new THREE.MeshLambertMaterial({
color:pedColors[
Math.floor(Math.random()*pedColors.length)
]
})
);

const x=(Math.random()-.5)*540;
const z=(Math.random()-.5)*540;

mesh.position.set(x,.75,z);
mesh.castShadow=true;

scene.add(mesh);

npcs.push({
mesh,
speed:.015+Math.random()*.035,
angle:Math.random()*Math.PI*2,
timer:Math.random()*200,
walk:Math.random()
});
}

document.getElementById("pop-count").textContent=npcs.length;


/* =========================================================
   CACHORROS
========================================================= */

const dogGeo=new THREE.BoxGeometry(.6,.45,1.1);
const dogMat=new THREE.MeshLambertMaterial({
color:0x92400e
});

for(let i=0;i<18;i++){

const dog=new THREE.Mesh(dogGeo,dogMat);

dog.position.set(
(Math.random()-.5)*520,
.25,
(Math.random()-.5)*520
);

dog.castShadow=true;

scene.add(dog);

npcs.push({
mesh:dog,
speed:.02+Math.random()*.025,
angle:Math.random()*Math.PI*2,
timer:Math.random()*150,
walk:.5
});
}


/* =========================================================
   CARROS DO TRÂNSITO
========================================================= */

const traffic=[];

const trafficColors=[
0xdc2626,
0x2563eb,
0xf59e0b,
0xffffff,
0x111827,
0x16a34a,
0x9333ea
];

function createTrafficCar(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(1.8,.65,3.8),
new THREE.MeshStandardMaterial({
color:trafficColors[
Math.floor(Math.random()*trafficColors.length)
],
roughness:.35
})
);

body.position.y=.5;

group.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(1.5,.5,1.7),
new THREE.MeshStandardMaterial({
color:0x172033,
metalness:.5,
roughness:.15
})
);

cabin.position.set(0,.95,-.2);

group.add(cabin);

return group;
}


for(let i=0;i<35;i++){

const car=createTrafficCar();

const horizontal=Math.random()>.5;

if(horizontal){

car.position.set(
(Math.random()-.5)*560,
0,
(Math.random()>.5?1:-1)*Math.floor(
(Math.random()*8)-4
)*70
);

}else{

car.position.set(
(Math.random()>.5?1:-1)*Math.floor(
(Math.random()*8)-4
)*70,
0,
(Math.random()-.5)*560
);
}

car.rotation.y=horizontal?
(Math.random()>.5?Math.PI/2:-Math.PI/2):
(Math.random()>.5?0:Math.PI);

scene.add(car);

traffic.push({
mesh:car,
horizontal,
speed:.15+Math.random()*.12
});
}

document.getElementById("traffic-count").textContent=traffic.length;


/* =========================================================
   CARRO DO JOGADOR
========================================================= */

const carParent=new THREE.Group();

scene.add(carParent);

const headlight=new THREE.SpotLight(
0xffffff,
3,
80,
Math.PI/4,
.4
);

headlight.position.set(0,.8,1.5);
headlight.target.position.set(0,0,25);

carParent.add(headlight);
carParent.add(headlight.target);


const vehicleConfigs=[

{
name:"Supercarro V8",
maxSpeed:1.4,
accel:.03,
steering:.04,

createMesh(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2,.6,4.2),
new THREE.MeshStandardMaterial({
color:0xd97706,
roughness:.2,
metalness:.8
})
);

body.position.y=.5;
body.castShadow=true;

group.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(1.6,.5,2),
new THREE.MeshStandardMaterial({
color:0x0284c7,
roughness:.1,
metalness:.9
})
);

cabin.position.set(0,.95,-.2);

group.add(cabin);

return group;
}
},

{
name:"SUV Tático",
maxSpeed:1,
accel:.022,
steering:.03,

createMesh(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2.2,1.1,4.4),
new THREE.MeshStandardMaterial({
color:0x1e3a8a,
roughness:.4
})
);

body.position.y=.8;
body.castShadow=true;

group.add(body);

return group;
}
},

{
name:"Hypercar Neon",
maxSpeed:1.7,
accel:.04,
steering:.045,

createMesh(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.ConeGeometry(1.4,4.4,5),
new THREE.MeshStandardMaterial({
color:0x059669,
roughness:.1,
metalness:.9
})
);

body.rotation.x=Math.PI/2;
body.position.y=.5;
body.castShadow=true;

group.add(body);

return group;
}
}
];

let activeCarMesh=null;

let playerStats={
level:1,
xp:0,
maxXp:100,
gold:0,
maxSpeed:1.4,
accel:.03,
steering:.04
};

let carPhysics={
speed:0,
angle:0
};


function switchCar(index){

if(activeCarMesh)
carParent.remove(activeCarMesh);

const config=vehicleConfigs[index];

activeCarMesh=config.createMesh();

carParent.add(activeCarMesh);

playerStats.maxSpeed=config.maxSpeed;
playerStats.accel=config.accel;
playerStats.steering=config.steering;

document.getElementById("car-name").textContent=config.name;
}

switchCar(0);


/* =========================================================
   DRONES / PROJÉTEIS
========================================================= */

const bullets=[];
const targets=[];

const bulletGeo=new THREE.SphereGeometry(.25,6,6);
const bulletMat=new THREE.MeshBasicMaterial({
color:0x38bdf8
});

const targetGeo=new THREE.OctahedronGeometry(1.5);

const targetMat=new THREE.MeshStandardMaterial({
color:0xef4444,
metalness:.8
});


function spawnDroneTarget(){

const drone=new THREE.Mesh(
targetGeo,
targetMat
);

drone.position.set(
(Math.random()-.5)*500,
6+Math.random()*8,
(Math.random()-.5)*500
);

scene.add(drone);
targets.push(drone);
}

for(let i=0;i<12;i++)
