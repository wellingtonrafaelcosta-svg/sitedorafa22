<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simulador Urbano 3D - Cidade Viva</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{overflow:hidden;background:#050811;color:white;user-select:none}
#canvas-container{width:100vw;height:100vh}

.hud{
position:absolute;top:20px;left:20px;z-index:10;
background:rgba(10,15,29,.9);
padding:16px 20px;border-radius:12px;
border:1px solid rgba(56,189,248,.3);
box-shadow:0 10px 30px #000;
min-width:270px;
pointer-events:none;
backdrop-filter:blur(8px)
}

.hud h2{
font-size:16px;color:#38bdf8;
margin-bottom:9px;
text-transform:uppercase;
letter-spacing:1px
}

.stat-row{
display:flex;
justify-content:space-between;
margin-bottom:5px;
font-size:13px;
color:#cbd5e1
}

.stat-bar{
background:#1e293b;
height:8px;
border-radius:4px;
overflow:hidden;
margin:4px 0 10px
}

.stat-fill{
background:linear-gradient(90deg,#0284c7,#38bdf8);
height:100%;
width:0%
}

.garage-panel{
position:absolute;
top:20px;
right:20px;
z-index:10;
background:rgba(10,15,29,.9);
padding:14px;
border-radius:12px;
border:1px solid rgba(234,179,8,.3);
display:flex;
flex-direction:column;
gap:6px;
backdrop-filter:blur(8px)
}

.garage-btn{
background:#1e293b;
color:#f8fafc;
border:1px solid #334155;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
font-weight:600;
font-size:12px
}

.garage-btn:hover{
background:#0284c7;
border-color:#38bdf8
}

.crosshair{
position:absolute;
top:50%;
left:50%;
width:12px;
height:12px;
border:2px solid rgba(239,68,68,.8);
border-radius:50%;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:5
}

.quest-box{
position:absolute;
bottom:20px;
left:50%;
z-index:10;
transform:translateX(-50%);
background:rgba(10,15,29,.92);
padding:10px 24px;
border-radius:20px;
border:1px solid #eab308;
color:#fef08a;
font-weight:600;
font-size:13px;
box-shadow:0 4px 20px #000;
text-align:center;
white-space:nowrap
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div class="hud">
<h2>🏙️ Cidade Viva</h2>

<div class="stat-row">
<span>Nível:</span>
<strong id="level">1</strong>
</div>

<div class="stat-bar">
<div id="xp-bar" class="stat-fill"></div>
</div>

<div class="stat-row">
<span>Veículo:</span>
<strong id="car-name" style="color:#38bdf8">
Supercarro V8
</strong>
</div>

<div class="stat-row">
<span>Velocidade:</span>
<span id="stat-speed">0 km/h</span>
</div>

<div class="stat-row">
<span>Créditos:</span>
<span style="color:#facc15">
🪙 <span id="gold">0</span>
</span>
</div>

<div class="stat-row">
<span>População:</span>
<span style="color:#4ade80">
<span id="pop-count">0</span> cidadãos
</span>
</div>

<div class="stat-row">
<span>Trânsito:</span>
<span style="color:#fb923c">
<span id="traffic-count">0</span> carros
</span>
</div>
</div>

<div class="garage-panel">
<div style="font-size:11px;color:#94a3b8;font-weight:bold">
SELEÇÃO DE VEÍCULO
</div>

<button class="garage-btn" onclick="switchCar(0)">
🏎️ Supercarro V8
</button>

<button class="garage-btn" onclick="switchCar(1)">
🛻 SUV Tático
</button>

<button class="garage-btn" onclick="switchCar(2)">
⚡ Hypercar Neon
</button>
</div>

<div class="crosshair"></div>

<div class="quest-box">
🎮 W A S D / Setas para dirigir • ESPAÇO para disparar
</div>

<div id="canvas-container"></div>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const container=document.getElementById("canvas-container");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x101827);

scene.fog=new THREE.FogExp2(
0x101827,
0.004
);

const camera=new THREE.PerspectiveCamera(
55,
window.innerWidth/window.innerHeight,
0.1,
900
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,1.25)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;

renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

container.appendChild(renderer.domElement);

const clock=new THREE.Clock();


/* =====================================================
   OBJETOS REUTILIZÁVEIS
===================================================== */

const v1=new THREE.Vector3();
const v2=new THREE.Vector3();
const camOffset=new THREE.Vector3();
const up=new THREE.Vector3(0,1,0);


/* =====================================================
   ILUMINAÇÃO
===================================================== */

const hemisphere=new THREE.HemisphereLight(
0xdbeafe,
0x172033,
0.8
);

scene.add(hemisphere);

const sun=new THREE.DirectionalLight(
0xffedd5,
1.7
);

sun.position.set(120,150,80);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

sun.shadow.camera.near=10;
sun.shadow.camera.far=400;

sun.shadow.camera.left=-180;
sun.shadow.camera.right=180;
sun.shadow.camera.top=180;
sun.shadow.camera.bottom=-180;

scene.add(sun);


/* =====================================================
   CHÃO
===================================================== */

const CITY=600;

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(CITY,CITY),
new THREE.MeshLambertMaterial({
color:0x151b25
})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =====================================================
   RUAS
===================================================== */

const roadMat=new THREE.MeshLambertMaterial({
color:0x242a33
});

for(let p=-280;p<=280;p+=70){

const vertical=new THREE.Mesh(
new THREE.PlaneGeometry(20,CITY),
roadMat
);

vertical.rotation.x=-Math.PI/2;
vertical.position.set(p,0.02,0);

scene.add(vertical);


const horizontal=new THREE.Mesh(
new THREE.PlaneGeometry(CITY,20),
roadMat
);

horizontal.rotation.x=-Math.PI/2;
horizontal.position.set(0,0.021,p);

scene.add(horizontal);

}


/* =====================================================
   FAIXAS
===================================================== */

const lineMat=new THREE.MeshBasicMaterial({
color:0xf8fafc
});

for(let p=-280;p<=280;p+=70){

for(let q=-285;q<285;q+=14){

const line1=new THREE.Mesh(
new THREE.PlaneGeometry(.3,6),
lineMat
);

line1.rotation.x=-Math.PI/2;
line1.position.set(p,.035,q);

scene.add(line1);


const line2=new THREE.Mesh(
new THREE.PlaneGeometry(6,.3),
lineMat
);

line2.rotation.x=-Math.PI/2;
line2.position.set(q,.036,p);

scene.add(line2);

}
}


/* =====================================================
   PRÉDIOS
===================================================== */

const buildingColors=[
0x263241,
0x334155,
0x374151,
0x1e293b,
0x3f3f46,
0x475569
];

for(let x=-245;x<=245;x+=70){

for(let z=-245;z<=245;z+=70){

/* praça central */

if(Math.abs(x)<45 && Math.abs(z)<45)
continue;

const height=20+Math.random()*65;

const building=new THREE.Mesh(
new THREE.BoxGeometry(50,height,50),
new THREE.MeshStandardMaterial({
color:
buildingColors[
Math.floor(
Math.random()*buildingColors.length
)
],
roughness:.8
})
);

building.position.set(
x,
height/2,
z
);

building.castShadow=true;
building.receiveShadow=true;

scene.add(building);


/* -------------------------
   JANELAS
------------------------- */

const windowMat=new THREE.MeshBasicMaterial({
color:
Math.random()>.45
?0xffe9a3
:0x93c5fd
});

for(let wx=-20;wx<=20;wx+=8){

for(let wy=8;wy<height-5;wy+=9){

if(Math.random()<.32)
continue;

const windowMesh=new THREE.Mesh(
new THREE.PlaneGeometry(3,3),
windowMat
);

windowMesh.position.set(
x+wx,
wy,
z-25.02
);

scene.add(windowMesh);

}

}

}

}


/* =====================================================
   ÁRVORES
===================================================== */

const trunkGeo=new THREE.CylinderGeometry(
.3,.45,4,7
);

const trunkMat=new THREE.MeshLambertMaterial({
color:0x5b3a29
});

const leavesGeo=new THREE.SphereGeometry(
2.8,8,8
);

const leavesMat=new THREE.MeshLambertMaterial({
color:0x166534
});

for(let i=0;i<100;i++){

const tree=new THREE.Group();

const trunk=new THREE.Mesh(
trunkGeo,
trunkMat
);

trunk.position.y=2;

const leaves=new THREE.Mesh(
leavesGeo,
leavesMat
);

leaves.position.y=5;

tree.add(trunk);
tree.add(leaves);

tree.position.set(
(Math.random()-.5)*540,
0,
(Math.random()-.5)*540
);

scene.add(tree);

}


/* =====================================================
   POSTES
===================================================== */

const poleGeo=new THREE.CylinderGeometry(
.1,.14,7,8
);

const poleMat=new THREE.MeshLambertMaterial({
color:0x111827
});

const lampGeo=new THREE.SphereGeometry(
.35,8,8
);

const lampMat=new THREE.MeshBasicMaterial({
color:0xfff3a3
});

for(let x=-280;x<=280;x+=35){

for(let z=-280;z<=280;z+=35){

if(Math.random()<.45)
continue;

const pole=new THREE.Mesh(
poleGeo,
poleMat
);

pole.position.set(
x,
3.5,
z
);

scene.add(pole);

const lamp=new THREE.Mesh(
lampGeo,
lampMat
);

lamp.position.set(
x,
7,
z
);

scene.add(lamp);

}

}


/* =====================================================
   PEDRESTRES
===================================================== */

const npcs=[];

const pedestrianGeo=
new THREE.CylinderGeometry(
.3,.25,1.5,8
);

const pedestrianColors=[
0x38bdf8,
0xf97316,
0xf43f5e,
0xa78bfa,
0x4ade80,
0xfacc15,
0xe2e8f0
];

for(let i=0;i<80;i++){

const pedestrian=new THREE.Mesh(
pedestrianGeo,
new THREE.MeshLambertMaterial({
color:
pedestrianColors[
Math.floor(
Math.random()*pedestrianColors.length
)
]
})
);

pedestrian.position.set(
(Math.random()-.5)*540,
.75,
(Math.random()-.5)*540
);

pedestrian.castShadow=true;

scene.add(pedestrian);

npcs.push({
mesh:pedestrian,
speed:.018+Math.random()*.035,
angle:Math.random()*Math.PI*2,
timer:50+Math.random()*200
});

}


/* =====================================================
   CACHORROS
===================================================== */

const dogGeo=new THREE.BoxGeometry(
.6,.45,1.1
);

const dogMat=new THREE.MeshLambertMaterial({
color:0x92400e
});

for(let i=0;i<15;i++){

const dog=new THREE.Mesh(
dogGeo,
dogMat
);

dog.position.set(
(Math.random()-.5)*520,
.25,
(Math.random()-.5)*520
);

dog.castShadow=true;

scene.add(dog);

npcs.push({
mesh:dog,
speed:.02+Math.random()*.025,
angle:Math.random()*Math.PI*2,
timer:50+Math.random()*180
});

}

document.getElementById("pop-count").textContent=
npcs.length;


/* =====================================================
   TRÂNSITO
===================================================== */

const traffic=[];

const trafficColors=[
0xdc2626,
0x2563eb,
0xf59e0b,
0xffffff,
0x111827,
0x16a34a,
0x9333ea
];


function createTrafficCar(){

const group=new THREE.Group();


const body=new THREE.Mesh(
new THREE.BoxGeometry(1.8,.65,3.8),
new THREE.MeshStandardMaterial({
color:
trafficColors[
Math.floor(
Math.random()*trafficColors.length
)
],
roughness:.35,
metalness:.15
})
);

body.position.y=.5;
body.castShadow=true;

group.add(body);


const cabin=new THREE.Mesh(
new THREE.BoxGeometry(1.45,.5,1.7),
new THREE.MeshStandardMaterial({
color:0x172033,
roughness:.15,
metalness:.5
})
);

cabin.position.set(
0,
.95,
-.2
);

group.add(cabin);


/* faróis */

const lightMat=new THREE.MeshBasicMaterial({
color:0xfff7cc
});

const rearMat=new THREE.MeshBasicMaterial({
color:0xef4444
});

for(const x of [-.65,.65]){

const front=new THREE.Mesh(
new THREE.BoxGeometry(.25,.18,.08),
lightMat
);

front.position.set(x,.55,1.94);

group.add(front);

const rear=new THREE.Mesh(
new THREE.BoxGeometry(.25,.18,.08),
rearMat
);

rear.position.set(x,.55,-1.94);

group.add(rear);

}

return group;

}


for(let i=0;i<35;i++){

const car=createTrafficCar();

const horizontal=Math.random()>.5;

if(horizontal){

const lane=
Math.floor(
Math.random()*8
)-4;

car.position.set(
(Math.random()-.5)*560,
0,
lane*70+10
);

car.rotation.y=
Math.random()>.5
?Math.PI/2
:-Math.PI/2;

}else{

const lane=
Math.floor(
Math.random()*8
)-4;

car.position.set(
lane*70+10,
0,
(Math.random()-.5)*560
);

car.rotation.y=
Math.random()>.5
?0
:Math.PI;

}

scene.add(car);

traffic.push({
mesh:car,
speed:.12+Math.random()*.1
});

}

document.getElementById("traffic-count").textContent=
traffic.length;


/* =====================================================
   JOGADOR
===================================================== */

const carParent=new THREE.Group();

scene.add(carParent);

const headlight=new THREE.SpotLight(
0xffffff,
3,
80,
Math.PI/4,
.4
);

headlight.position.set(
0,.8,1.5
);

headlight.target.position.set(
0,0,25
);

carParent.add(headlight);
carParent.add(headlight.target);


/* =====================================================
   VEÍCULOS
===================================================== */

const vehicleConfigs=[

{
name:"Supercarro V8",
maxSpeed:1.4,
accel:.03,
steering:.04,

createMesh(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2,.6,4.2),
new THREE.MeshStandardMaterial({
color:0xd97706,
roughness:.2,
metalness:.8
})
);

body.position.y=.5;
body.castShadow=true;

group.add(body);


const cabin=new THREE.Mesh(
new THREE.BoxGeometry(1.6,.5,2),
new THREE.MeshStandardMaterial({
color:0x0284c7,
roughness:.1,
metalness:.9
})
);

cabin.position.set(
0,.95,-.2
);

group.add(cabin);

return group;

}
},


{
name:"SUV Tático",
maxSpeed:1,
accel:.022,
steering:.03,

createMesh(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2.2,1.1,4.4),
new THREE.MeshStandardMaterial({
color:0x1e3a8a,
roughness:.4
})
);

body.position.y=.8;
body.castShadow=true;

group.add(body);

const roof=new THREE.Mesh(
new THREE.BoxGeometry(1.8,.45,2.1),
new THREE.MeshStandardMaterial({
color:0x172554,
roughness:.3
})
);

roof.position.set(
0,1.55,-.15
);

group.add(roof);

return group;

}
},


{
name:"Hypercar Neon",
maxSpeed:1.7,
accel:.04,
steering:.045,

createMesh(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.ConeGeometry(
1.4,
4.4,
5
),
new THREE.MeshStandardMaterial({
color:0x059669,
roughness:.1,
metalness:.9
})
);

body.rotation.x=Math.PI/2;
body.position.y=.5;
body.castShadow=true;

group.add(body);

const neon=new THREE.PointLight(
0x00ffcc,
1.5,
8
);

neon.position.y=.7;

group.add(neon);

return group;

}
}

];


let activeCarMesh=null;

const playerStats={
level:1,
xp:0,
maxXp:100,
gold:0,
maxSpeed:1.4,
accel:.03,
steering:.04
};

const carPhysics={
speed:0,
angle:0
};


function switchCar(index){

if(activeCarMesh)
carParent.remove(activeCarMesh);

const config=vehicleConfigs[index];

activeCarMesh=config.createMesh();

carParent.add(activeCarMesh);

playerStats.maxSpeed=config.maxSpeed;
playerStats.accel=config.accel;
playerStats.steering=config.steering;

document.getElementById("car-name").textContent=
config.name;

}


switchCar(0);


/* =====================================================
   ARMAS
===================================================== */

const bullets=[];
const targets=[];

const bulletGeo=
new THREE.SphereGeometry(.25,6,6);

const bulletMat=
new THREE.MeshBasicMaterial({
color:0x38bdf8
});

const targetGeo=
new THREE.OctahedronGeometry(1.5);

const targetMat=
new THREE.MeshStandardMaterial({
color:0xef4444,
metalness:.8
});


function spawnDroneTarget(){

const drone=new THREE.Mesh(
targetGeo,
targetMat
);

drone.position.set(
(Math.random()-.5)*500,
6+Math.random()*7,
(Math.random()-.5)*500
);

scene.add(drone);

targets.push(drone);

}


for(let i=0;i<10;i++)
spawnDroneTarget();


function fireWeapon(){

for(const offset of [-.8,.8]){

const bullet=new THREE.Mesh(
bulletGeo,
bulletMat
);

v1.set(
offset,
.8,
1.8
);

v1.applyMatrix4(
carParent.matrixWorld
);

bullet.position.copy(v1);

v2.set(
0,
0,
1
);

v2.applyAxisAngle(
up,
carPhysics.angle
);

v2.multiplyScalar(2.8);

bullet.userData={
vx:v2.x,
vy:v2.y,
vz:v2.z,
life:50
};

scene.add(bullet);

bullets.push(bullet);

}

}


/* =====================================================
   CONTROLES
===================================================== */

const keys={};

window.addEventListener(
"keydown",
e=>{

keys[e.code]=true;

if(e.code==="Space"){
e.preventDefault();
fireWeapon();
}

}
);

window.addEventListener(
"keyup",
e=>{
keys[e.code]=false;
}
);


/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function animate(){

requestAnimationFrame(animate);

const delta=Math.min(
clock.getDelta(),
.1
);

const factor=delta*60;


/* -------------------------
   CARRO
------------------------- */

if(keys.KeyW||keys.ArrowUp){

carPhysics.speed=Math.min(
carPhysics.speed+
playerStats.accel*factor,
playerStats.maxSpeed
);

}
else if(keys.KeyS||keys.ArrowDown){

carPhysics.speed=Math.max(
carPhysics.speed-
playerStats.accel*factor,
-playerStats.maxSpeed/2
);

}
else{

carPhysics.speed*=
Math.pow(.95,factor);

}


if(Math.abs(carPhysics.speed)>.005){

const direction=
carPhysics.speed>0?1:-1;

if(keys.KeyA||keys.ArrowLeft){

carPhysics.angle+=
playerStats.steering*
direction*
factor;

}

if(keys.KeyD||keys.ArrowRight){

carPhysics.angle-=
playerStats.steering*
direction*
factor;

}

}


carParent.rotation.y=
carPhysics.angle;


carParent.position.x+=
Math.sin(carPhysics.angle)*
carPhysics.speed*
factor;


carParent.position.z+=
Math.cos(carPhysics.angle)*
carPhysics.speed*
factor;


/* limite */

carParent.position.x=
Math.max(
-290,
Math.min(
290,
carParent.position.x
)
);

carParent.position.z=
Math.max(
-290,
Math.min(
290,
carParent.position.z
)
);


document.getElementById(
"stat-speed"
).textContent=
Math.round(
Math.abs(carPhysics.speed)*110
)+" km/h";


/* =====================================================
   TRÂNSITO
===================================================== */

for(const car of traffic){

const angle=car.mesh.rotation.y;

car.mesh.position.x+=
Math.sin(angle)*
car.speed*
factor;

car.mesh.position.z+=
Math.cos(angle)*
car.speed*
factor;

if(car.mesh.position.x>310)
car.mesh.position.x=-310;

if(car.mesh.position.x<-310)
car.mesh.position.x=310;

if(car.mesh.position.z>310)
car.mesh.position.z=-310;

if(car.mesh.position.z<-310)
car.mesh.position.z=310;

}


/* =====================================================
   PEDESTRES
===================================================== */

for(const npc of npcs){

npc.timer-=factor;

if(npc.timer<=0){

npc.angle+=
(Math.random()-.5)*1.5;

npc.timer=
80+Math.random()*220;

}

npc.mesh.position.x+=
Math.sin(npc.angle)*
npc.speed*
factor;

npc.mesh.position.z+=
Math.cos(npc.angle)*
npc.speed*
factor;

npc.mesh.rotation.y=
npc.angle;


/* limites */

if(Math.abs(npc.mesh.position.x)>285)
npc.angle=Math.PI-npc.angle;

if(Math.abs(npc.mesh.position.z)>285)
npc.angle=-npc.angle;

}


/* =====================================================
   PROJÉTEIS
===================================================== */

for(let i=bullets.length-1;i>=0;i--){

const bullet=bullets[i];

bullet.position.x+=
bullet.userData.vx*factor;

bullet.position.y+=
bullet.userData.vy*factor;

bullet.position.z+=
bullet.userData.vz*factor;

bullet.userData.life-=factor;

let hit=false;

for(let j=targets.length-1;j>=0;j--){

const target=targets[j];

if(
bullet.position.distanceToSquared(
target.position
)<8
){

scene.remove(target);

targets.splice(j,1);

playerStats.xp+=35;
playerStats.gold+=80;

if(
playerStats.xp>=
playerStats.maxXp
){

playerStats.level++;
playerStats.xp=0;

}

document.getElementById("level")
.textContent=
playerStats.level;

document.getElementById("gold")
.textContent=
playerStats.gold;

document.getElementById("xp-bar")
.style.width=
(
playerStats.xp/
playerStats.maxXp*
100
)+"%";

spawnDroneTarget();

hit=true;

break;

}

}


if(
hit||
bullet.userData.life<=0
){

scene.remove(bullet);

bullets.splice(i,1);

}

}


/* =====================================================
   DRONES
===================================================== */

for(const target of targets){

target.rotation.y+=
.025*factor;

target.rotation.x+=
.012*factor;

}


/* =====================================================
   CÂMERA
===================================================== */

camOffset.set(
0,
4.5,
-11
);

camOffset.applyAxisAngle(
up,
carPhysics.angle
);

v1.copy(
carParent.position
);

v1.add(camOffset);

camera.position.lerp(
v1,
.12
);

v2.copy(
carParent.position
);

v2.y+=1;

camera.lookAt(v2);


/* =====================================================
   RENDER
===================================================== */

renderer.render(
scene,
camera
);

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);


/* =====================================================
   INICIAR
===================================================== */

animate();

</script>
